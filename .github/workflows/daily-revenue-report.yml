name: 📊 Daily AdMob Revenue Report

on:
  # Sếp 2026-08-02: ĐÃ BỎ `schedule` — báo cáo hằng ngày chuyển sang chạy LOCAL
  # (launchd `ai.tranquil.revenue-report-local`, 8:00 giờ VN, wrapper
  # ~/.openclaw/bin/revenue-report-local.sh). Lý do: free-runner trễ lịch ~3h nên
  # phải đặt cron lệch để bù, tin vẫn tới lúc ~06:1x thay vì 8h như mong muốn.
  #
  # LƯU Ý: disable workflow qua API là VÔ ÍCH ở repo này — `keep-alive.yml` chạy
  # ngày 1 & 15 hằng tháng và TỰ ENABLE lại (đã cắn: tắt 01/08, tới 02/08 chạy tiếp).
  # Muốn dừng hẳn thì phải bỏ `schedule` ở đây như hiện tại.
  # Vẫn giữ workflow_dispatch để chạy tay khi cần backfill.

  # Cho phép trigger thủ công để test
  workflow_dispatch:
    inputs:
      date_offset:
        description: 'Offset ngày (0 = hôm qua, 1 = hôm kia, ...)'
        required: false
        default: '0'

jobs:
  revenue-report:
    name: Fetch & Send Revenue Report
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write  # Cần thiết để push dữ liệu lịch sử

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install dependencies
        run: pip install -r requirements.txt

      - name: 📊 Run Revenue Report
        env:
          HUB_ADMIN_SA_KEY: ${{ secrets.HUB_ADMIN_SA_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python scripts/main.py

      - name: ✅ Done
        if: success()
        run: echo "Revenue report sent to Discord successfully!"

      - name: 🚀 Commit & Push history data
        if: success()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          # main.py ghi history vào public/data/ (repo đã migrate sang public/ + auth).
          # Add cả path mới lẫn cũ để an toàn nếu cấu trúc còn đổi.
          git add public/data/revenue_history.json data/revenue_history.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: update daily revenue history [skip ci]"
          git pull --rebase origin main
          git push origin main

      - name: ❌ On Failure
        if: failure()
        run: echo "Revenue report failed. Check logs above."
